name: CI

on:
  push:
    branches: [main]    # каждый push в main
  pull_request:         # и каждый Pull Request в любую ветку

jobs:
  test:
    runs-on: ubuntu-latest

    # Рядом с тестами GitHub запустит чистый PostgreSQL в контейнере
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agromarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Переменные окружения вместо .env.test (их значения — только для CI)
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agromarket_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: agromarket_test
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 2h
      ADMIN_EMAIL: admin@test.kz
      ADMIN_PASSWORD: Admin12345
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4          # скачать код репозитория
      - uses: actions/setup-node@v4        # установить Node.js
        with:
          node-version: 22
          cache: npm
      - run: npm ci                        # зависимости строго по package-lock.json
      - run: npm test                      # globalSetup сам выполнит db:init
